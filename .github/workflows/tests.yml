name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

env:
  UNITY_VERSION: 6000.3.11f1

jobs:
  editmode-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-
            Library-

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      # @v4(latest=4.4) CLI 래퍼는 이 프로젝트에서 즉시 실패함 → 4.3.2 고정
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results
          # checks:write 권한 없으면 check-run 생성 실패로 step 전체가 빨간불 될 수 있음
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Tests

      - name: Show failed tests in log
        if: always()
        run: |
          echo "## test-results tree"
          find test-results -type f | sort || true
          echo "## Failed cases"
          python3 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("test-results")
          if not root.exists():
              print("no test-results dir")
              sys.exit(0)
          found = False
          for p in root.rglob("*.xml"):
              text = p.read_text(errors="replace")
              print(f"--- {p} ---")
              for label in ("Passed", "Failed", "Inconclusive", "Skipped"):
                  n = len(re.findall(rf'result="{label}"', text))
                  if n:
                      print(f"  {label}: {n}")
              for m in re.finditer(
                  r'<test-case[^>]*name="([^"]+)"[^>]*result="Failed"[^>]*>.*?<message[^>]*><!\[CDATA\[(.*?)\]\]></message>',
                  text,
                  re.S,
              ):
                  found = True
                  print("FAIL:", m.group(1))
                  print(m.group(2).strip()[:500])
                  print()
              if not found:
                  for m in re.finditer(r'<test-case[^>]*fullname="([^"]+)"[^>]*result="Failed"', text):
                      found = True
                      print("FAIL:", m.group(1))
          if not found:
              for p in root.rglob("*"):
                  if p.suffix.lower() in {".log", ".txt"}:
                      t = p.read_text(errors="replace")
                      if "error CS" in t or "Scripts have compiler errors" in t:
                          print(f"--- errors in {p} ---")
                          for line in t.splitlines():
                              if "error CS" in line or "error:" in line.lower():
                                  print(line)
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: test-results
          if-no-files-found: warn
