<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="sapsar-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <button id="unity-start" type="button" aria-label="게임 시작">
      <span class="start-logo"></span>
      <span class="start-label">탭하여 시작</span>
    </button>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var startBtn = document.querySelector("#unity-start");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: #5c3d2e; color: #fff; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: #c4a574; color: #231f20; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function resumeWebAudio() {
        try {
          if (typeof WEBAudio !== "undefined" && WEBAudio.audioContext &&
              WEBAudio.audioContext.state === "suspended") {
            WEBAudio.audioContext.resume();
          }
        } catch (e) {}
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
        errorHandler: function (err) {
          unityShowBanner(String(err), "error");
          return true;
        },
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        var gameW = {{{ WIDTH }}};
        var gameH = {{{ HEIGHT }}};
        var maxH = Math.min(window.innerHeight * 0.92, gameH);
        var maxW = Math.min(window.innerWidth * 0.95, gameW);
        var scale = Math.min(maxW / gameW, maxH / gameH);
        canvas.style.width = Math.floor(gameW * scale) + "px";
        canvas.style.height = Math.floor(gameH * scale) + "px";
      }

      var unityStarted = false;
      function startUnity() {
        if (unityStarted) return;
        unityStarted = true;
        startBtn.style.display = "none";
        document.querySelector("#unity-loading-bar").style.display = "block";
        resumeWebAudio();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function (unityInstance) {
            document.querySelector("#unity-loading-bar").style.display = "none";
            resumeWebAudio();
            document.addEventListener("pointerdown", resumeWebAudio);
            document.addEventListener("keydown", resumeWebAudio);
            var fs = document.querySelector("#unity-fullscreen-button");
            if (fs) {
              fs.onclick = function () {
                unityInstance.SetFullscreen(1);
              };
            }
          }).catch(function (message) {
            unityShowBanner(message, "error");
          });
        };
        script.onerror = function () {
          unityShowBanner("게임을 불러오지 못했습니다.", "error");
        };
        document.body.appendChild(script);
      }

      startBtn.addEventListener("click", startUnity, { once: true });
      startBtn.addEventListener("touchend", function (e) {
        e.preventDefault();
        startUnity();
      }, { once: true });
    </script>
  </body>
</html>
